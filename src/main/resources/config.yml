# ==============================================================================
#                       Astanix ESP - Anti-Storage ESP
#          Высокопроизводительная защита от читов типа Storage ESP
#                   Разработано для сервера Astanix (Paper 1.21.x)
# ==============================================================================

# Дистанция (в блоках), начиная с которой контейнеры и хранилища маскируются.
# Если игрок находится дальше этой дистанции, для него блоки подменяются на
# блок поверхности/опоры (земля, камень, доски и т.д.), а сущности скрываются.
# Клиент читера удаляет TileEntity и убирает подсветку сундуков (Storage ESP).
hide-distance: 25.0

# Периодичность проверки дистанции игроков (в тиках сервера).
# 1 тик = 50 мс, 2 тика = 100 мс. Значение 2 обеспечивает превосходную
# плавность и экономит до 60% процессорного времени.
check-interval-ticks: 2

# Максимальная глубина поиска вниз (в блоках) для определения опорного блока,
# если сундук или хранилище парит в воздухе или подвешено.
max-downward-search: 32

# Материалы по умолчанию, если под хранилищем нет опорных блоков (например, в воздухе над пустотой)
fallback-disguise:
  overworld: "STONE"
  overworld-deepslate: "DEEPSLATE" # Используется на высоте Y < 0
  nether: "NETHERRACK"
  the-end: "END_STONE"

# Список типов блоков, подлежащих маскировке (Material).
target-blocks:
  # Сундуки и бочки
  - "CHEST"
  - "TRAPPED_CHEST"
  - "ENDER_CHEST"
  - "BARREL"

  # Печи, плавильни, коптильни
  - "FURNACE"
  - "BLAST_FURNACE"
  - "SMOKER"

  # Зельеварение и зачарование
  - "BREWING_STAND"
  - "ENCHANTING_TABLE"

  # Шалкеровые ящики (все цвета)
  - "SHULKER_BOX"
  - "WHITE_SHULKER_BOX"
  - "ORANGE_SHULKER_BOX"
  - "MAGENTA_SHULKER_BOX"
  - "LIGHT_BLUE_SHULKER_BOX"
  - "YELLOW_SHULKER_BOX"
  - "LIME_SHULKER_BOX"
  - "PINK_SHULKER_BOX"
  - "GRAY_SHULKER_BOX"
  - "LIGHT_GRAY_SHULKER_BOX"
  - "CYAN_SHULKER_BOX"
  - "PURPLE_SHULKER_BOX"
  - "BLUE_SHULKER_BOX"
  - "BROWN_SHULKER_BOX"
  - "GREEN_SHULKER_BOX"
  - "RED_SHULKER_BOX"
  - "BLACK_SHULKER_BOX"

  # Дополнительные хранилища и редстоун-контейнеры
  - "HOPPER"
  - "DISPENSER"
  - "DROPPER"
  - "CRAFTER"
  - "CHISELED_BOOKSHELF"

# Список сущностей-хранилищ, скрываемых на расстоянии.
target-entities:
  - "CHEST_MINECART"
  - "HOPPER_MINECART"
  - "CHEST_BOAT"

# Логирование отладочной информации в консоль
debug: false
