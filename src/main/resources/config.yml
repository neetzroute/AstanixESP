# ==============================================================================
# Astanix-ESP & FreeCam Protection Configuration
# Высокопроизводительный серверный плагин маскировки хранилищ (Paper 1.21.x)
# Режим работы: Бесшумный (без спама алертов в чат).
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. ЗАЩИТА ОТ STORAGE ESP (ДИСТАНЦИОННАЯ МАСКИРОВКА)
# ------------------------------------------------------------------------------

# Дистанция (в блоках), начиная с которой хранилища маскируются.
# Если игрок находится дальше указанного расстояния, для него сундук подменяется
# на блок, на котором он стоит (трава -> трава, камень -> камень, доски -> доски).
hide-distance: 25.0

# Интервал проверки дистанции (в тиках сервера). 2 тика = 100 мс.
check-interval-ticks: 2

# Максимальная глубина поиска вниз для парящих контейнеров.
max-downward-search: 32

# Блоки по умолчанию при отсутствии опоры (над пустотой)
fallback-disguise:
  overworld: "STONE"
  overworld-deepslate: "DEEPSLATE" # Высота Y < 0
  nether: "NETHERRACK"
  the-end: "END_STONE"

# Список типов блоков, подлежащих маскировке (Material)
target-blocks:
  # Сундуки и бочки
  - "CHEST"
  - "TRAPPED_CHEST"
  - "ENDER_CHEST"
  - "BARREL"

  # Печи
  - "FURNACE"
  - "BLAST_FURNACE"
  - "SMOKER"

  # Магия и варка
  - "BREWING_STAND"
  - "ENCHANTING_TABLE"

  # Редстоун-хранилища
  - "DISPENSER"
  - "DROPPER"
  - "HOPPER"
  - "CRAFTER"
  - "CHISELED_BOOKSHELF"

  # Шалкеровые ящики (все цвета)
  - "SHULKER_BOX"
  - "WHITE_SHULKER_BOX"
  - "ORANGE_SHULKER_BOX"
  - "MAGENTA_SHULKER_BOX"
  - "LIGHT_BLUE_SHULKER_BOX"
  - "YELLOW_SHULKER_BOX"
  - "LIME_SHULKER_BOX"
  - "PINK_SHULKER_BOX"
  - "GRAY_SHULKER_BOX"
  - "LIGHT_GRAY_SHULKER_BOX"
  - "CYAN_SHULKER_BOX"
  - "PURPLE_SHULKER_BOX"
  - "BLUE_SHULKER_BOX"
  - "BROWN_SHULKER_BOX"
  - "GREEN_SHULKER_BOX"
  - "RED_SHULKER_BOX"
  - "BLACK_SHULKER_BOX"

# Список сущностей-хранилищ, которые скрываются на расстоянии
target-entities:
  - "CHEST_MINECART"
  - "HOPPER_MINECART"
  - "CHEST_BOAT"

# Включение детального логирования в консоль для отладки
debug: false

# ------------------------------------------------------------------------------
# 2. ЗАЩИТА ОТ FREECAM & СКРЫТИЕ ЗА СТЕНАМИ (WALL OCCLUSION)
# ------------------------------------------------------------------------------
freecam:
  # Контроль дистанции взаимодействия (Reach)
  reach:
    enabled: true
    survival-max: 4.8
    creative-max: 5.5

  # Проверка луча зрения (Raytrace Line of Sight)
  raytrace:
    enabled: true
    check-blocks: true
    check-entities: true
    check-breaking: true
    check-air-clicks: true
    check-inventory-open: true
    multi-ray-samples: 5

    # Блоки, сквозь которые разрешено взаимодействие (прозрачные для луча)
    ignored-blocks:
      - "AIR"
      - "CAVE_AIR"
      - "VOID_AIR"
      - "WATER"
      - "SHORT_GRASS"
      - "TALL_GRASS"
      - "FERN"
      - "LARGE_FERN"
      - "DANDELION"
      - "POPPY"
      - "BLUE_ORCHID"
      - "ALLIUM"
      - "AZURE_BLUET"
      - "RED_TULIP"
      - "ORANGE_TULIP"
      - "WHITE_TULIP"
      - "PINK_TULIP"
      - "OXEYE_DAISY"
      - "CORNFLOWER"
      - "LILY_OF_THE_VALLEY"
      - "WITHER_ROSE"
      - "SUNFLOWER"
      - "LILAC"
      - "ROSE_BUSH"
      - "PEONY"
      - "DEAD_BUSH"
      - "BROWN_MUSHROOM"
      - "RED_MUSHROOM"
      - "CRIMSON_FUNGUS"
      - "WARPED_FUNGUS"
      - "HANGING_ROOTS"
      - "MOSS_CARPET"
      - "SNOW"
      - "VINE"
      - "GLOW_LICHEN"
      - "STRING"
      - "TRIPWIRE"
      - "REDSTONE_WIRE"
      - "LEVER"
      - "LIGHT"
      - "STRUCTURE_VOID"

  # Реальное скрытие сундуков сквозь стены вблизи игрока (Wall Occlusion)
  # Если сундук находится за глухой стеной, для игрока он подменяется на блок окружения,
  # чтобы камера FreeCam не могла обнаружить секретные комнаты, базы и тайники.
  occlusion:
    enabled: true
    radius: 18.0

# ------------------------------------------------------------------------------
# 3. СООБЩЕНИЯ (Kyori Adventure MiniMessage)
# ------------------------------------------------------------------------------
messages:
  prefix: "<gradient:#00D2FF:#3A7BD5><bold>[Astanix-Security]</bold></gradient> "
  no-permission: "<red>У вас нет прав для выполнения этой команды!</red>"
  reloaded: "<green>Конфигурация Astanix успешно перезагружена!</green>"
  bypass-enabled: "<yellow>Режим обхода <green>включен</green> (маскировка отключена для вас).</yellow>"
  bypass-disabled: "<yellow>Режим обхода <red>выключен</red> (маскировка активна).</yellow>"
  player-not-found: "<red>Игрок не найден в сети.</red>"
